app:
  storage:
    # Render's container runs as a non-root user; /tmp is writable but ephemeral.
    local-dir: ${STORAGE_LOCAL_DIR:/tmp/gh-clearing/uploads}
  auth:
    workos:
      enabled: ${WORKOS_FRONTEND_ENABLED:true}
      client-id: ${WORKOS_CLIENT_ID:}
      api-hostname: ${WORKOS_API_HOSTNAME:api.workos.com}

spring:
  flyway:
    # Business demo data is deliberately isolated from production migrations.
    locations:
      - classpath:db/migration
      - classpath:db/staging
