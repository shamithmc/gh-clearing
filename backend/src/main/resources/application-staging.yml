app:
  storage:
    # Render's container runs as a non-root user; /tmp is writable but ephemeral.
    local-dir: ${STORAGE_LOCAL_DIR:/tmp/gh-clearing/uploads}
  auth:
    workos:
      enabled: ${WORKOS_FRONTEND_ENABLED:true}
      client-id: ${WORKOS_CLIENT_ID:}
      api-hostname: ${WORKOS_API_HOSTNAME:api.workos.com}

spring:
  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:gh_clearing}?sslmode=${DB_SSLMODE:require}}
    username: ${DB_USER:${SPRING_DATASOURCE_USERNAME:postgres}}
    password: ${DB_PASSWORD:${SPRING_DATASOURCE_PASSWORD:postgres}}
    driver-class-name: org.postgresql.Driver
  flyway:
    # Business demo data is deliberately isolated from production migrations.
    locations:
      - classpath:db/migration
      - classpath:db/staging
