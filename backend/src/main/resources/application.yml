spring:
  application:
    name: gh-clearing
  
  datasource:
    url: jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:gh_clearing}
    username: ${DB_USER:postgres}
    password: ${DB_PASSWORD:postgres}
    driver-class-name: org.postgresql.Driver

  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: false
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
        format_sql: true
    open-in-view: false

  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: true
    baseline-version: 0

  servlet:
    multipart:
      max-file-size: ${ATTACHMENT_MAX_FILE_SIZE:10MB}
      max-request-size: ${ATTACHMENT_MAX_REQUEST_SIZE:11MB}

  security:
    oauth2:
      resourceserver:
        jwt:
          issuer-uri: ${WORKOS_ISSUER_URI:https://api.workos.com/}
          jwk-set-uri: ${WORKOS_JWK_SET_URI:https://api.workos.com/sso/jwks/${WORKOS_CLIENT_ID:client_unconfigured}}

  # Spring Mail — uses Mailhog locally (docker-compose port 1025)
  mail:
    host: ${MAIL_HOST:localhost}
    port: ${MAIL_PORT:1025}
    username: ${MAIL_USER:}
    password: ${MAIL_PASS:}
    properties:
      mail:
        smtp:
          auth: false
          starttls:
            enable: false

# Multi-tenancy metadata parameters
multitenancy:
  strategy: DISCRIMINATOR_COLUMN
  discriminator-field: tenant_id

# Server settings
server:
  port: ${PORT:8080}
  error:
    include-message: always

# Application-level mail settings
app:
  attachments:
    max-size-bytes: ${ATTACHMENT_MAX_SIZE_BYTES:10485760}
    retention-years: ${ATTACHMENT_RETENTION_YEARS:7}
    clamav:
      host: ${CLAMAV_HOST:localhost}
      port: ${CLAMAV_PORT:3310}
      connect-timeout-millis: ${CLAMAV_CONNECT_TIMEOUT_MILLIS:2000}
      read-timeout-millis: ${CLAMAV_READ_TIMEOUT_MILLIS:10000}
  mail:
    from: noreply@ghcp.internal
    dispatch-enabled: true
    notifications-enabled: ${NOTIFICATIONS_ENABLED:true}
