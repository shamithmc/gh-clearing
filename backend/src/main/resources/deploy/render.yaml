# yaml-language-server: $schema=https://render.com/schema/render.yaml.json
projects:
  - name: gh-clearing
    environments:
      - name: staging
        networking:
          isolation: enabled
        services:
          - type: web
            name: gh-clearing-staging
            runtime: docker
            plan: free
            region: singapore
            dockerfilePath: ./backend/src/main/resources/deploy/Dockerfile
            dockerContext: .
            healthCheckPath: /
            autoDeployTrigger: checksPass
            envVars:
              - key: SPRING_PROFILES_ACTIVE
                value: staging
              - key: WORKOS_ISSUER_URI
                value: https://api.workos.com/
              - key: WORKOS_CLIENT_ID
                sync: false
              - key: WORKOS_JWK_SET_URI
                sync: false
              - key: WORKOS_API_HOSTNAME
                value: api.workos.com
              - key: WORKOS_FRONTEND_ENABLED
                value: "true"
              # External Staging Database (Neon PostgreSQL 16)
              # Topology metadata: name: gh-clearing-staging-db, postgresMajorVersion: "16"
              - key: DB_HOST
                sync: false
              - key: DB_PORT
                value: "5432"
              - key: DB_NAME
                sync: false
              - key: DB_USER
                sync: false
              - key: DB_PASSWORD
                sync: false
              - key: DB_SSLMODE
                value: "require"
              - key: SPRING_DATASOURCE_URL
                sync: false
              - key: NOTIFICATIONS_ENABLED
                value: "false"
              - key: APP_MAIL_DISPATCH_ENABLED
                value: "false"
