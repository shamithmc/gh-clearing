services:
  postgres:
    image: postgres:16-alpine
    container_name: gh-clearing-db
    environment:
      POSTGRES_DB: gh_clearing
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d gh_clearing"]
      interval: 5s
      timeout: 5s
      retries: 5

  keycloak:
    image: quay.io/keycloak/keycloak:24.0.0
    container_name: gh-clearing-auth
    environment:
      KEYCLOAK_ADMIN: admin
      KEYCLOAK_ADMIN_PASSWORD: admin
      KC_DB: dev-mem
    command: start-dev --http-port 9090
    ports:
      - "9090:9090"
    healthcheck:
      test: ["CMD", "exec", "3<>/dev/tcp/127.0.0.1/9090", "&&", "echo", "-e", "\"GET /health/ready HTTP/1.1\\r\\n\\r\\n\"", ">&3", "&&", "close(3)"]
      interval: 10s
      timeout: 5s
      retries: 3

  mailhog:
    image: mailhog/mailhog:v1.0.1
    container_name: gh-clearing-mail
    ports:
      - "1025:1025"   # SMTP port — Spring Mail connects here
      - "8025:8025"   # Web UI — view captured emails at http://localhost:8025
    restart: unless-stopped

volumes:
  pgdata:
