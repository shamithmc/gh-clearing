name: CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    env:
      WORK_UNIT_BRANCH: ${{ github.event.pull_request.head.ref || github.ref_name }}

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: gh_clearing
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d gh_clearing"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
    - name: Checkout Repository
      uses: actions/checkout@v4
      with:
        fetch-depth: 0 # Full history needed for remote branch and diff checks
        ref: ${{ github.event.pull_request.head.sha || github.sha }}

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.10'

    - name: Test Governance Validators
      run: python -m unittest discover .github/scripts/tests

    - name: Validate Work Unit & Path Claim Locks
      id: work-unit
      run: python .github/scripts/validate_work_unit.py

    - name: Validate Gate Definitions
      run: python .github/scripts/validate_gate_config.py

    - name: Validate CODEOWNERS Precedence
      run: python .github/scripts/validate_codeowners.py

    - name: Reconcile Deployment Topology
      run: python .github/scripts/validate_topology.py

    - name: Validate Dependency Allowlist
      run: python .github/scripts/validate_dependencies.py

    - name: Validate Architectural Invariant Obligations
      run: python .github/scripts/validate_obligations.py

    - name: Validate Official Schema Provenance
      id: schema-provenance
      run: python .github/scripts/validate_schema_provenance.py

    - name: Set up JDK 21
      if: hashFiles('backend/pom.xml') != ''
      uses: actions/setup-java@v4
      with:
        java-version: '21'
        distribution: 'temurin'
        cache: 'maven'
        cache-dependency-path: 'backend/pom.xml'

    - name: Test Backend and Enforce Contract-Code Coverage
      if: hashFiles('backend/pom.xml') != ''
      run: mvn -f backend/pom.xml clean verify

    - name: Enforce Zero-Warning Compiler Proof
      if: steps.work-unit.outputs.proof == 'COMPILER'
      run: >
        mvn -f backend/pom.xml clean compile
        -Dmaven.compiler.failOnWarning=true

    - name: Set up Node.js
      if: hashFiles('frontend/package.json') != ''
      uses: actions/setup-node@v4
      with:
        node-version: '20'
        cache: 'npm'
        cache-dependency-path: 'frontend/package-lock.json'

    - name: Install, Test, and Build Frontend (npm)
      if: hashFiles('frontend/package.json') != ''
      run: |
        cd frontend
        npm ci
        npm test
        npm run build

    - name: Install and Run E2E Tests (Playwright)
      if: hashFiles('e2e/package.json') != ''
      run: |
        cd e2e
        npm ci
        npx playwright install --with-deps chromium
        npx playwright test

    - name: Execute Conformance Proof
      if: >-
        steps.work-unit.outputs.proof == 'CONFORMANCE' ||
        steps.schema-provenance.outputs.billing_changed == 'true'
      run: >
        mvn -f backend/pom.xml
        -Dtest=IataXmlComplianceTest,InvoiceXmlGenerationTest test

    - name: Confirm Declared Verification Proof
      if: startsWith(github.event_name, 'pull_request')
      env:
        DECLARED_PROOF: ${{ steps.work-unit.outputs.proof }}
      run: |
        case "$DECLARED_PROOF" in
          UNIT|INTEGRATION|CONFORMANCE|COMPILER|E2E) ;;
          *) echo "Unsupported or missing proof: $DECLARED_PROOF"; exit 1 ;;
        esac
        echo "Declared $DECLARED_PROOF proof completed successfully."
